server:
  port: 4004

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: auth-service-route
              uri: http://auth-service.patient-management.local:4005
              predicates:
                - Path=/api-gateway/auth/**
              filters:
                - StripPrefix=2

            - id: auth-service-api-docs-route
              uri: http://auth-service.patient-management.local:4005
              predicates:
                - Path=/api-docs/auth
              filters:
                - RewritePath=/api-docs/auth,/v3/api-docs

            ## REST Client --> http://<alb-dns>/api-gateway/patients
            ## API Gateway --> http://patient-service.patient-management.local:4000/patients
            - id: patient-service-route
              uri: http://patient-service.patient-management.local:4000
              predicates:
                - Path=/api-gateway/patients/**
              filters:
                - StripPrefix=1
                - JwtValidation

            ## REST Client --> http://<alb-dns>/api-docs/patients
            ## API Gateway --> http://patient-service.patient-management.local:4000/v3/api-docs
            - id: patient-service-api-docs-route
              uri: http://patient-service.patient-management.local:4000
              predicates:
                - Path=/api-docs/patients
              filters:
                - RewritePath=/api-docs/patients,/v3/api-docs

            - id: patient-service-swagger-ui
              uri: http://patient-service.patient-management.local:4000
              predicates:
                - Path=/swagger-ui.html/**
